steps:
  # Install dependencies
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['install']

  # Build project (hasil ke dist/)
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Deploy ke App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'frontend'
    entrypoint: 'gcloud'
    args: ['app', 'deploy', 'app.yaml', '--quiet']

options:
  logging: CLOUD_LOGGING_ONLY