steps:
  # Build image (context backend)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/notes-backend'
      - '-f'
      - 'backend/Dockerfile'   
      - 'backend'            

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/notes-backend'

  # Deploy Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'notes-backend',
        '--image', 'gcr.io/$PROJECT_ID/notes-backend',
        '--platform', 'managed',
        '--region', 'us-central1',
        '--allow-unauthenticated',
        '--set-env-vars',
        'DB_HOST=34.172.113.167,DB_USER=admin,DB_PASS=mypassword,DB_NAME=notes_123230138,DB_PORT=3306'
      ]

images:
  - 'gcr.io/$PROJECT_ID/notes-backend'

options:
  logging: CLOUD_LOGGING_ONLY